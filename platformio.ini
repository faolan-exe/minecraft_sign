; Firmware für das MINECRAFT-LED-Schild
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3

[env]
test_framework = unity

[esp32]
platform = espressif32@6.9.0
framework = arduino
; Generisches ESP32-C3-Board mit 4 MB Flash (SuperMini, DevKitM, XIAO …)
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    fastled/FastLED@3.9.4
    esp32async/ESPAsyncWebServer@3.6.0
    esp32async/AsyncTCP@3.3.2
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; C3-SuperMini: Antenne schwach angepasst, mit voller Sendeleistung ist das WLAN kaum nutzbar
    -DWIFI_LOW_TX_POWER
build_unflags = -std=gnu++11
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
check_flags = cppcheck: --suppress=unusedFunction --suppress=missingIncludeSystem --suppress=*:*/.pio/* --suppress=preprocessorErrorDirective --inline-suppr

[env:esp32c3]
extends = esp32

; Flashen über das WLAN: pio run -e esp32c3_ota -t upload
; Hostname oder IP bei Bedarf per --upload-port überschreiben
[env:esp32c3_ota]
extends = esp32
upload_protocol = espota
upload_port = minecraft-sign.local

; Unit-Tests auf dem Rechner für die hardwareunabhängigen Module
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_deps = bblanchon/ArduinoJson@7.2.1
build_src_filter = -<*> +<layout.cpp> +<button.cpp> +<light_state.cpp> +<effect_list.cpp> +<settings.cpp>
test_build_src = yes
